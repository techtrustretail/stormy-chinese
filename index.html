<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Stormy Chinese Island</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Andika:wght@400;700&display=swap">
<style>
/* Layout: one cotton-candy sky, a column of big touch cards (max 880px), Stormy always nearby */
:root{
  --sky:#e3f4ff; --sky2:#fdeaf3; --cloud:#ffffff; --ink:#3d3553; --ink2:#6f6787;
  --candy:#ffc8dd; --candy-deep:#ff7aa2; --blue:#a2d2ff; --blue-deep:#4f9be0;
  --mint:#bdf0e0; --sun:#ffd166; --line:#e4ddf0;
  --t1:#e63946; --t2:#f08c2e; --t3:#2a9d8f; --t4:#3d6fb6; --t0:#9a94ad;
  --ok:#3bb273; --bad:#ef476f;
  --f-display:"Baloo 2","Chalkboard SE","Comic Sans MS",system-ui,sans-serif;
  --f-body:"Andika","Avenir Next",system-ui,sans-serif;
  --f-han:"Kaiti SC","STKaiti","KaiTi","Songti SC","PingFang SC","Noto Sans SC",serif;
  --r:22px;
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;font-family:var(--f-body);color:var(--ink);background:linear-gradient(180deg,var(--sky) 0%,var(--sky2) 100%) fixed;
  padding:env(safe-area-inset-top,0) max(16px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0) max(16px,env(safe-area-inset-left,0px));
  -webkit-user-select:none;user-select:none;overflow-x:hidden}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:4px solid var(--blue-deep);outline-offset:3px}
[hidden]{display:none!important}
.sky-deco{position:fixed;inset:0;pointer-events:none;z-index:-1;overflow:hidden}
.sky-deco i{position:absolute;background:#fff;border-radius:999px;opacity:.75;filter:blur(1px);animation:drift 60s linear infinite}
.sky-deco i::before,.sky-deco i::after{content:"";position:absolute;background:#fff;border-radius:50%}
.sky-deco i::before{width:55%;height:160%;left:15%;top:-70%}
.sky-deco i::after{width:40%;height:130%;left:50%;top:-45%}
@keyframes drift{from{transform:translateX(-30vw)}to{transform:translateX(130vw)}}
main{max-width:880px;margin:0 auto;padding-block:12px 40px}
.top{display:flex;align-items:center;gap:10px;padding-block:6px 14px}
.top .back{width:52px;height:52px;border-radius:50%;background:var(--cloud);font-size:26px;box-shadow:0 3px 0 var(--line)}
.top h1{font-family:var(--f-display);font-size:clamp(24px,4vw,34px);margin:0;flex:1;line-height:1.1;text-wrap:balance}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--cloud);border-radius:999px;padding:6px 14px;font-family:var(--f-display);font-weight:700;font-size:20px;box-shadow:0 3px 0 var(--line);font-variant-numeric:tabular-nums}
.card{background:var(--cloud);border-radius:var(--r);box-shadow:0 6px 0 var(--line);padding:20px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
@media (max-width:560px){.grid2{grid-template-columns:1fr}}
.big-btn{display:flex;align-items:center;justify-content:center;gap:10px;min-height:64px;padding:12px 22px;border-radius:999px;font-family:var(--f-display);font-weight:800;font-size:24px;background:var(--blue);box-shadow:0 5px 0 var(--blue-deep);transition:transform .08s}
.big-btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--blue-deep)}
.big-btn.pink{background:var(--candy);box-shadow:0 5px 0 var(--candy-deep)}
.big-btn.sun{background:var(--sun);box-shadow:0 5px 0 #e0a800}
.big-btn.mint{background:var(--mint);box-shadow:0 5px 0 #5cc8a8}
.big-btn:disabled{opacity:.45}
.han{font-family:var(--f-han);font-weight:400;line-height:1.1}
.py{font-family:var(--f-body);font-weight:700;letter-spacing:.02em}
.tone1{color:var(--t1)}.tone2{color:var(--t2)}.tone3{color:var(--t3)}.tone4{color:var(--t4)}.tone0{color:var(--t0)}
.muted{color:var(--ink2)}
.stars{font-size:30px;letter-spacing:4px;color:#e5dff0}
.stars b{color:var(--sun);font-weight:400;text-shadow:0 2px 0 #e0a800}

/* Stormy */
.stormy{width:100%;height:auto;overflow:visible}
.stormy .body-g{transform-origin:100px 150px;animation:breathe 3.2s ease-in-out infinite}
.stormy .eyes{transform-origin:100px 92px;animation:blink 5s infinite}
.stormy.jump .body-g{animation:jump .6s ease}
@keyframes breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.025,.975)}}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes jump{0%{transform:translateY(0)}40%{transform:translateY(-26px) scale(1.04)}70%{transform:translateY(0) scale(1.06,.94)}100%{transform:none}}
.bubble{position:relative;background:var(--cloud);border-radius:20px;padding:12px 18px;font-family:var(--f-display);font-size:22px;box-shadow:0 4px 0 var(--line);text-align:center}
.bubble::after{content:"";position:absolute;left:-14px;top:50%;margin-top:-12px;border:12px solid transparent;border-right-color:var(--cloud);border-left:0}
@media (max-width:560px){.bubble::after{left:50%;top:-14px;margin:0 0 0 -12px;border:12px solid transparent;border-bottom-color:var(--cloud);border-top:0}}

/* Who */
.who-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:20px;margin-top:20px}
.who{display:flex;flex-direction:column;align-items:center;gap:8px;padding:22px;border-radius:28px;background:var(--cloud);box-shadow:0 7px 0 var(--line);font-family:var(--f-display);font-size:34px;font-weight:800}
.who .ava{width:150px}
.hero-title{font-family:var(--f-display);font-weight:800;font-size:clamp(34px,6vw,54px);text-align:center;margin:10px 0 0;line-height:1}
.hero-title .han{font-size:.9em;color:var(--candy-deep)}

/* Home */
.home-head{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.home-head .name{font-family:var(--f-display);font-weight:800;font-size:30px;flex:1}
.stormy-stage{display:grid;grid-template-columns:minmax(0,220px) minmax(0,1fr);gap:16px;align-items:center;margin:14px 0}
@media (max-width:560px){.stormy-stage{grid-template-columns:1fr;justify-items:center}.stormy-stage .stormy-box{width:200px}}
.stormy-box{cursor:pointer}
.lvl{font-family:var(--f-display);font-size:18px;text-align:center}
.map{display:flex;flex-direction:column;gap:14px;margin-top:8px}
.isle{display:flex;align-items:center;gap:16px;padding:16px 20px;border-radius:26px;background:var(--cloud);box-shadow:0 6px 0 var(--line);text-align:left}
.isle .ic{font-size:46px;width:72px;height:72px;display:grid;place-items:center;border-radius:50%;flex:none}
.isle .t{font-family:var(--f-display);font-weight:800;font-size:26px;line-height:1.1}
.isle .s{font-size:16px}
.isle.locked{opacity:.55}
.isle .grow{flex:1;min-width:0}
.row-btns{display:flex;flex-wrap:wrap;gap:12px;margin-top:16px}
.row-btns>*{flex:1 1 180px}

/* Stations */
.stations{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
@media (max-width:520px){.stations{grid-template-columns:1fr}}
.station{display:flex;flex-direction:column;align-items:center;gap:4px;padding:22px 14px;border-radius:28px;background:var(--cloud);box-shadow:0 7px 0 var(--line)}
.station .ic{font-size:56px}
.station .t{font-family:var(--f-display);font-weight:800;font-size:25px}

/* Tabs */
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.tab{padding:10px 18px;border-radius:999px;background:var(--cloud);font-family:var(--f-display);font-weight:700;font-size:20px;box-shadow:0 3px 0 var(--line)}
.tab.on{background:var(--ink);color:#fff;box-shadow:none}

/* Flash card */
.flash{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;padding:26px 18px}
.flash .pic{font-size:72px;line-height:1}
.flash .han{font-size:clamp(84px,16vw,130px)}
.flash .pybig{font-size:clamp(40px,8vw,64px)}
.flash .en{font-size:22px}
.ctrl{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;margin-top:14px}
.ctrl .big-btn{flex:0 1 auto;min-width:120px}
.mic{position:relative}
.mic.rec{background:var(--bad);color:#fff;box-shadow:0 5px 0 #b3264c;animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.06)}}
.result{min-height:60px;margin-top:12px;display:flex;flex-direction:column;align-items:center;gap:6px}
.result .msg{font-family:var(--f-display);font-size:24px;font-weight:700}
.tonecv{width:100%;max-width:440px;height:130px;border-radius:16px;background:#f7f4fc}
.legend{display:flex;gap:16px;font-size:15px;justify-content:center}
.legend span::before{content:"";display:inline-block;width:22px;height:4px;border-radius:2px;margin-right:6px;vertical-align:middle;background:currentColor}
.nav{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:16px}
.nav .arrow{width:68px;height:68px;border-radius:50%;background:var(--cloud);font-size:30px;box-shadow:0 5px 0 var(--line)}
.nav .count{font-family:var(--f-display);font-size:22px;font-variant-numeric:tabular-nums}
.chars{display:flex;gap:4px;justify-content:center}
.chars .c-ok{color:var(--ok)}.chars .c-mid{color:var(--t2)}.chars .c-bad{color:var(--bad)}

/* Picto */
.evo{display:grid;grid-template-columns:1fr auto 1fr auto 1fr;align-items:stretch;gap:6px;margin:10px 0}
.evo .arr{align-self:center}
.evo .stage{display:flex;flex-direction:column;align-items:center;justify-content:space-between;gap:6px;background:#f7f4fc;border-radius:20px;padding:10px;min-width:0;transition:opacity .4s,transform .4s}
.evo .stage.dim{opacity:.18;transform:scale(.92)}
.evo .stage svg{width:100%;max-width:150px;height:auto}
.evo .stage .han{font-size:clamp(70px,13vw,120px);color:var(--ink)}
.evo .lab{font-size:15px;color:var(--ink2);font-weight:700}
.evo .arr{font-size:28px;color:var(--candy-deep)}
.oldpath{fill:none;stroke:#8a5a3c;stroke-width:6;stroke-linecap:round;stroke-linejoin:round}
.draw .oldpath{stroke-dasharray:1;stroke-dashoffset:0;animation:draw 1.4s ease backwards}
@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
.fact{font-size:20px;line-height:1.45;text-align:center;max-width:60ch;margin:6px auto 0}

/* Quiz */
.quiz-top{display:flex;align-items:center;gap:12px}
.prog{flex:1;height:18px;border-radius:999px;background:var(--cloud);overflow:hidden;box-shadow:inset 0 2px 0 var(--line)}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--candy),var(--blue));border-radius:999px;transition:width .3s}
.prompt{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;padding:22px 10px}
.prompt .ask{font-family:var(--f-display);font-size:24px;font-weight:700}
.prompt .han{font-size:clamp(80px,15vw,120px)}
.prompt svg{width:170px;height:auto}
.choices{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.choices.four{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:520px){.choices.four{grid-template-columns:repeat(2,minmax(0,1fr))}}
.choice{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:120px;padding:12px 6px;border-radius:24px;background:var(--cloud);box-shadow:0 6px 0 var(--line);transition:transform .08s}
.choice:active{transform:translateY(4px)}
.choice .han{font-size:clamp(46px,9vw,72px)}
.choice .pic{font-size:48px}
.choice .py{font-size:clamp(28px,5vw,40px)}
.choice svg{width:100%;max-width:110px;height:auto}
.choice.right{background:#d8f7e6;box-shadow:0 6px 0 var(--ok)}
.choice.wrong{background:#ffe0e8;box-shadow:0 6px 0 var(--bad);animation:shake .4s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.builder{display:flex;align-items:center;justify-content:center;gap:10px;font-family:var(--f-body);font-weight:700;font-size:44px}
.builder .slot{min-width:84px;padding:6px 14px;border-radius:18px;border:4px dashed var(--line);text-align:center}
.builder .slot.filled{border-style:solid;border-color:var(--ok);background:#effcf5}
.done-box{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;padding:28px}
.done-box .stars{font-size:56px}

/* Story */
.panel{border-radius:26px;overflow:hidden;background:var(--cloud);box-shadow:0 6px 0 var(--line);margin-bottom:18px}
.scene{position:relative;height:170px;display:flex;align-items:flex-end;justify-content:center;gap:18px;padding-bottom:14px}
.scene.river{background:linear-gradient(180deg,#bfe6ff 0%,#dff4ff 55%,#7cc6f2 56%,#5bb3ea 100%)}
.scene.desert{background:linear-gradient(180deg,#ffe8b8 0%,#fff3d6 55%,#f2c879 56%,#e0a85a 100%)}
.scene.school{background:linear-gradient(180deg,#e3f4ff 0%,#f3eafd 60%,#c9b8e8 61%,#b3a0dc 100%)}
.scene.garden{background:linear-gradient(180deg,#d8f3ff 0%,#eafbe9 55%,#8fd694 56%,#64c27a 100%)}
.scene.sunset{background:linear-gradient(180deg,#ffd6a5 0%,#ffc8dd 55%,#8fb8ef 56%,#6aa0e6 100%)}
.scene .cast{font-size:84px;line-height:1;filter:drop-shadow(0 4px 0 rgba(0,0,0,.08))}
.scene .cast-stormy{width:120px}
.lines{display:flex;flex-direction:column;gap:12px;padding:16px}
.line{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:12px 14px;border-radius:18px;background:#f7f4fc;transition:background .2s}
.line.playing{background:#fff3c4}
.line .who-l{font-size:15px;font-weight:700;color:var(--ink2)}
.line .han{font-size:clamp(30px,5.5vw,42px)}
.line .py{font-size:20px}
.line .en{font-size:16px;color:var(--ink2)}
.line .lb{display:flex;gap:8px}
.mini{width:56px;height:56px;border-radius:50%;background:var(--blue);font-size:24px;box-shadow:0 4px 0 var(--blue-deep)}
.mini.pink{background:var(--candy);box-shadow:0 4px 0 var(--candy-deep)}
.mini.rec{background:var(--bad);animation:pulse 1s infinite}
.line .sc{font-size:18px;color:var(--sun)}

/* Shop & board */
.shop{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:14px}
.food{display:flex;flex-direction:column;align-items:center;gap:2px;padding:16px 6px;border-radius:24px;background:var(--cloud);box-shadow:0 6px 0 var(--line);font-family:var(--f-display);font-size:20px;font-weight:700}
.food .e{font-size:54px}
.fly{position:fixed;font-size:54px;z-index:50;transition:transform .7s cubic-bezier(.5,-0.3,.6,1),opacity .7s;pointer-events:none}
table.board{width:100%;border-collapse:collapse;font-size:22px}
.board td{padding:14px 10px;border-bottom:2px solid var(--line)}
.board .rank{font-family:var(--f-display);font-size:30px;width:56px}
.board .num{text-align:right;font-family:var(--f-display);font-weight:800;font-variant-numeric:tabular-nums}
.note{font-size:15px;color:var(--ink2);margin-top:12px}
.ptable-wrap{overflow-x:auto}
table.ptable{border-collapse:collapse;font-size:16px;min-width:520px;width:100%}
.ptable th,.ptable td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left}
.ptable th{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2)}
.pill{display:inline-block;padding:2px 10px;border-radius:999px;font-size:14px;font-weight:700}
.pill.r{background:#ffe0e8;color:#b3264c}.pill.y{background:#fff1c9;color:#8a6200}.pill.g{background:#d8f7e6;color:#1f7a4c}.pill.n{background:#eee9f6;color:var(--ink2)}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 22px;border-radius:999px;font-family:var(--f-display);font-size:20px;z-index:60;opacity:0;transition:opacity .25s;pointer-events:none}
.toast.show{opacity:1}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:70}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="sky-deco" aria-hidden="true"><i style="top:12%;width:160px;height:46px;animation-duration:70s"></i><i style="top:38%;width:110px;height:34px;animation-duration:95s;animation-delay:-40s"></i><i style="top:70%;width:190px;height:52px;animation-duration:120s;animation-delay:-70s"></i></div>
<main id="app"></main>
<div class="toast" id="toast"></div>
<canvas class="confetti" id="confetti" hidden></canvas>

<script src="config.js"></script>
<script src="pinyin-dict.js"></script>
<script src="lessons/index.js"></script>
<script src="lessons/common.js"></script>
<script>
// Nạp các bài theo LESSON_ORDER (mỗi bài là lessons/<id>.js)
(LESSON_ORDER||[]).forEach(id=>document.write('<script src="lessons/'+id+'.js"><\/script>'));
</script>
<script>
"use strict";
const CFG = window.QQ_CONFIG;
const $ = (s, r=document) => r.querySelector(s);
const app = $('#app');
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuffle = a => { a = a.slice(); for (let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };
const pick = (arr, n, not) => shuffle(arr.filter(x => x !== not)).slice(0, n);
const today = () => { const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); };
const weekKey = () => { const d=new Date(); const day=(d.getDay()+6)%7; d.setDate(d.getDate()-day); return d.toISOString().slice(0,10); };
const starsHtml = (n, max=3) => '<span class="stars">'+'<b>★</b>'.repeat(n)+'★'.repeat(Math.max(0,max-n))+'</span>';

/* ---------- Pinyin helpers ---------- */
const TONE_CH = {1:'āēīōūǖĀĒĪŌŪ',2:'áéíóúǘÁÉÍÓÚ',3:'ǎěǐǒǔǚǍĚǏǑǓ',4:'àèìòùǜÀÈÌÒÙ'};
const toneOf = syl => { for (const t of [1,2,3,4]) for (const c of TONE_CH[t]) if (syl.includes(c)) return t; return 0; };
const bare = syl => syl.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
const V = 'aeiouüāáǎàēéěèīíǐìōóǒòūúǔùǖǘǚǜAEIOUĀÁǍÀĒÉĚÈĪÍǏÌŌÓǑÒŪÚǓÙ';
const SYL_RE = new RegExp('(zh|ch|sh|[bpmfdtnlgkhjqxrzcsyw])?['+V+']+(ng(?!['+V+'])|n(?!['+V+'])|r(?!['+V+']))?','gi');
const sylls = py => (py.match(SYL_RE) || []);
const colorPy = py => py.replace(SYL_RE, m => '<span class="tone'+toneOf(m)+'">'+m+'</span>');
const DIGITS = {'0':'líng','1':'yī','2':'èr','3':'sān','4':'sì','5':'wǔ','6':'liù','7':'qī','8':'bā','9':'jiǔ'};
const textToSylls = t => [...t].map(c => DIGITS[c] || (window.PY_DICT||{})[c]).filter(Boolean);

/* ---------- Storage ---------- */
const store = {
  get(k, d){ try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch(e){ return d; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }
};
let P = null;           // current player profile
let playerId = store.get('qq_zh_last', null);
function blankProfile(id){ return {id, wallet:0, total:0, week:{}, day:{}, streak:{last:'',count:0}, items:{}, st:{}, stormy:{xp:0}, seen:{}}; }
function loadPlayer(id){ playerId=id; store.set('qq_zh_last', id); P = Object.assign(blankProfile(id), store.get('qq_zh_'+id, {})); }
function save(){ store.set('qq_zh_'+P.id, P); scheduleSync(); }
function addStars(n){
  if (n<=0) return;
  const d = today(), w = weekKey();
  P.wallet += n; P.total += n; P.week[w] = (P.week[w]||0)+n; P.day[d] = (P.day[d]||0)+n;
  if (P.day[d] >= CFG.streakStars && P.streak.last !== d){
    const y = new Date(); y.setDate(y.getDate()-1);
    const yk = y.getFullYear()+'-'+String(y.getMonth()+1).padStart(2,'0')+'-'+String(y.getDate()).padStart(2,'0');
    P.streak.count = (P.streak.last === yk) ? P.streak.count+1 : 1; P.streak.last = d;
    toast('🔥 Streak: '+P.streak.count+' day'+(P.streak.count>1?'s':'')+'!'); confetti();
  }
  save(); refreshChips();

function streakNow(){ const d=today(); const y=new Date(); y.setDate(y.getDate()-1);

let toastT;

function confetti(){
  const cv = $('#confetti'); cv.hidden = false; const g = cv.getContext('2d'); cv.width = innerWidth; cv.height = innerHeight;
  const cols = ['#ffafcc','#a2d2ff','#ffd166','#bdf0e0','#ff7aa2'];
  const ps = Array.from({length:90}, () => ({x:Math.random()*cv.width, y:-20-Math.random()*cv.height*0.4, vx:(Math.random()-.5)*3, vy:2+Math.random()*3, r:4+Math.random()*6, c:cols[Math.floor(Math.random()*5)], a:Math.random()*6}));
  let f = 0; (function step(){ g.clearRect(0,0,cv.width,cv.height);
    ps.forEach(p => { p.x+=p.vx; p.y+=p.vy; p.a+=0.1; g.fillStyle=p.c; g.save(); g.translate(p.x,p.y); g.rotate(p.a); g.fillRect(-p.r/2,-p.r/2,p.r,p.r*0.6); g.restore(); });
    if (++f < 150) requestAnimationFrame(step); else cv.hidden = true; })();
}

function award(id, stars){
  const key = 'say.'+IK(id)+'.'+today();
  const prev = P.seen[key] || 0; if (stars > prev){ P.seen[key] = stars; addStars(stars - prev); }
  logItem(id, null, stars);
}
function showScore(box, r, id){
  const [msg, voice] = PRAISE[r.stars];
  box.innerHTML = `${r.stars?starsHtml(r.stars):''}<span class="msg">${msg}${r.pts!=null&&r.stars?` <span class="muted">(${r.pts}/100)</span>`:''}</span>
    ${r.chars&&r.chars.length?`<div class="chars han" style="font-size:40px">${r.chars.map(c=>`<span class="${c.s>=80?'c-ok':c.s>=60?'c-mid':'c-bad'}">${esc(c.w)}</span>`).join('')}</div>`:''}
    ${r.heard?`<div class="muted">I heard: <b class="han">${esc(r.heard)}</b></div>`:''}${r.hint?`<div class="muted">${esc(r.hint)}</div>`:''}
    ${r.A?`<canvas class="tonecv"></canvas><div class="legend"><span style="color:#4f9be0">Teacher</span><span style="color:#ff7aa2">You</span></div>`:''}`;
  if (r.A) drawTone(box.querySelector('canvas'), r.A, r.B);
  if (r.stars){ sayCommon(voice); if (r.stars===3){ confetti(); } award(id, r.stars); }
  // điểm trạm "Listen & Say" dựa trên các từ vựng
  const l = L(cur.lesson), good = l.words.filter(w => (itemOf(w.id)||{}).best >= 2).length, n = l.words.length;
  setStation(cur.lesson+'.speak', good >= n*0.9 ? 3 : good >= n*0.6 ? 2 : good >= Math.ceil(n*0.3) ? 1 : 0);
}

/* ---------- Games ---------- */
const GAMES = [
  {k:'listen', ic:'👂', t:'Listen & Pick', d:'Hear a word, tap the picture'},
  {k:'tones', ic:'🎢', t:'Tone Catcher', d:'Which tone did you hear?'},
  {k:'picto', ic:'🎯', t:'Picture Match', d:'Which character is the picture?'},
  {k:'build', ic:'🧩', t:'Sound Builder', d:'Build the sound: b + a = ba'},
  {k:'order', ic:'🚂', t:'Sentence Train', d:'Put the words in order'},
  {k:'review', ic:'👑', t:'Boss Battle', d:'Mixed questions from every island'}
];
// Mỗi bài chỉ có những game có dữ liệu
const gamesFor = l => GAMES.filter(g => ({
  listen: l.words.length >= 3, tones: (l.sounds||[]).some(s => s.group==='Tones'),
  picto: (l.pictos||[]).length >= 3, build: (l.builder||[]).length >= 3, order: (l.sentences||[]).length >= 2}[g.k]));
const TONE_PATH = {1:'M8 10 L72 10', 2:'M8 40 L72 6', 3:'M8 16 Q40 64 72 10', 4:'M8 6 L72 44'};
const TONE_MARK = Object.fromEntries(Object.entries(TONE_PATH).map(([t,d]) => [t, `<svg viewBox="0 0 80 50" width="80" height="50"><path d="${d}" fill="none" stroke="currentColor" stroke-width="8" stroke-linecap="round"/></svg>`]));
function makeQuestions(k, all){
  const id = cur.lesson, l = L(id), A = x => audioUrl(id, x);
  if (k==='listen') return shuffle(l.words).slice(0, all ? 99 : 8).map(w => ({item:w.id, audio:A(w.id), ask:'Listen! Which one?',
    show:`<div style="font-size:64px">👂</div>`, choices: shuffle([w].concat(pick(l.words.filter(x => bare(x.py)!==bare(w.py)),2,w))).map(c=>({ok:c===w, html:`<span class="pic">${c.pic}</span><span class="han">${c.hz}</span>`, reveal:colorPy(c.py)}))}));
  if (k==='tones'){ const ts = l.sounds.find(g=>g.group==='Tones').items;
    return shuffle(ts).slice(0,8).map(t => { const fam = ts.filter(x => bare(x.py)===bare(t.py)).sort((a,b)=>a.tone-b.tone);
      return {item:t.id, audio:A(t.id), ask:'Which tone?', show:`<div style="font-size:64px">🎢</div>`, four:true,
        choices: fam.map(c=>({ok:c===t, html:`<span class="py tone${c.tone}">${c.py}</span><span class="tone${c.tone}">${TONE_MARK[c.tone]}</span>`}))}; }); }
  if (k==='picto'){ const ps = l.pictos;
    const a = shuffle(ps).map(p => ({item:p.id, audio:null, ask:'Which character is this picture?', show:ART[p.art].pic,
      choices: shuffle([p].concat(pick(ps,2,p))).map(c=>({ok:c===p, html:`<span class="han">${c.hz}</span>`, sound:A(c.id)}))}));
    const b = shuffle(ps).slice(0,3).map(p => ({item:p.id, audio:A(p.id), ask:'Which picture is this character?', show:`<span class="han">${p.hz}</span>`,
      choices: shuffle([p].concat(pick(ps,2,p))).map(c=>({ok:c===p, html:ART[c.art].pic}))}));
    return a.concat(b); }
  if (k==='build'){ const bs = l.builder; const inis = [...new Set(bs.map(b=>b.ini))], fins = [...new Set(bs.map(b=>b.fin))];
    return shuffle(bs).slice(0,8).map(b => ({item:b.id, audio:A(b.id), build:b,
      iniChoices: shuffle([b.ini].concat(pick(inis,2,b.ini))), finChoices: shuffle([b.fin].concat(pick(fins,2,b.fin)))})); }
  if (k==='order') return shuffle(l.sentences).map(o => ({item:o.id, audio:A(o.id), order:o}));
  if (k==='review'){
    // Gom câu hỏi từ mọi đảo, ưu tiên mục con hay sai (đỏ > vàng > chưa làm > đã thuộc)
    const pool = [], keep = cur.lesson;
    lessonList().forEach(lid => { cur.lesson = lid; gamesFor(L(lid)).forEach(g => makeQuestions(g.k, true).forEach(q => {
      const it = P.items[lid+'/'+q.item]; const t = it ? it.ok+it.bad : 0, acc = t ? it.ok/t : (it&&it.spN ? it.sp/it.spN/3 : null);
      pool.push({...q, lesson:lid, w:(acc==null?1:acc<0.6?3:acc<0.85?2:0)+Math.random()*1.5}); })); });
    cur.lesson = keep;
    const seen = new Set();
    return pool.sort((a,b)=>b.w-a.w).filter(q => { const k2 = q.lesson+'/'+q.item; if (seen.has(k2)) return false; seen.add(k2); return true; }).slice(0,12).sort(()=>Math.random()-0.5);
  }
}
function runGame(g){
  const qs = makeQuestions(g.k); let i = 0, right = 0;
  const key = cur.lesson+'.g_'+g.k, home = cur.lesson, isRev = g.k==='review', backTo = isRev ? 'home' : g.k==='picto' ? 'picto' : 'games';
  app.innerHTML = topBar(g.ic+' '+g.t, backTo) + `<div class="quiz-top"><div class="prog"><i id="pg" style="width:0"></i></div><span class="chip" id="qn"></span></div><div id="q"></div>`;
  const finish = () => {
    const pct = right/qs.length, stars = pct>=0.9?3:pct>=0.7?2:1; addStars(2);
    cur.lesson = home;
    if (isRev){ setStation('review', stars); P.seen['review.'+today()] = 1; save(); }
    else { setStation(key, stars);
    const avail = gamesFor(L(cur.lesson)), gs = avail.filter(x => (P.st[cur.lesson+'.g_'+x.k]||0) >= 2).length;
    setStation(cur.lesson+'.games', gs>=avail.length?3:gs>=2?2:gs>=1?1:0);
    if (g.k==='picto') setStation(cur.lesson+'.picto', stars); }
    if (stars===3){ confetti(); sayCommon('great'); } else sayCommon(stars===2?'good':'jiayou');
    $('#q').innerHTML = `<div class="card done-box"><div style="max-width:200px">${stormySVG(stormyLevel(P.stormy.xp),'jump')}</div>
      ${starsHtml(stars)}<div class="msg" style="font-family:var(--f-display);font-size:30px;font-weight:800">${right} / ${qs.length} right!</div>
      <div class="row-btns" style="width:100%"><button class="big-btn" id="again">🔁 Play again</button><button class="big-btn pink" data-go="${backTo}">✅ Done</button></div></div>`;
    $('#again').onclick = () => runGame(g); $('#pg').style.width='100%';
  };
  const next = () => {
    if (i >= qs.length) return finish();
    const q = qs[i]; let tries = 0, locked = false; if (q.lesson) cur.lesson = q.lesson;
    $('#qn').textContent = (i+1)+' / '+qs.length; $('#pg').style.width = (i/qs.length*100)+'%';
    const answer = (ok, el) => {
      if (locked) return;
      if (ok){ locked = true; el.classList.add('right'); beep(true); if (tries===0){ right++; addStars(1); } logItem(q.item, tries===0);
        setTimeout(()=>{ i++; next(); }, 1100); }
      else { tries++; el.classList.add('wrong'); beep(false); setTimeout(()=>el.classList.remove('wrong'), 500); }
    };
    if (q.build){
      let stage = 0, wrong = 0;
      const b = q.build;
      const draw = () => { $('#q').innerHTML = `<div class="card prompt"><div class="ask">Listen and build the sound!</div>
        <div class="han" style="font-size:90px">${b.hz}</div>
        <div class="builder"><span class="slot ${stage>0?'filled':''}">${stage>0?b.ini:'?'}</span>+<span class="slot ${stage>1?'filled':''}">${stage>1?b.fin:'?'}</span>=<span class="slot ${stage>1?'filled':''}">${stage>1?colorPy(b.py):'?'}</span></div>
        <button class="big-btn" id="rep">🔊 Listen again</button></div>
        ${stage<2?`<p class="muted" style="text-align:center;font-size:20px">${stage===0?'Pick the first sound':'Pick the ending sound'}</p>
        <div class="choices">${(stage===0?q.iniChoices:q.finChoices).map(c=>`<button class="choice" data-v="${c}"><span class="py">${c}</span></button>`).join('')}</div>`:''}`;
        $('#rep').onclick = () => play(q.audio);
        $('#q').querySelectorAll('[data-v]').forEach(el => el.onclick = () => {
          const ok = el.dataset.v === (stage===0?b.ini:b.fin);
          if (ok){ el.classList.add('right'); beep(true); stage++; setTimeout(() => { draw(); if (stage===2){ play(q.audio);
              if (wrong===0){ right++; addStars(1); } logItem(q.item, wrong===0); setTimeout(()=>{ i++; next(); }, 1500); } }, 450); }
          else { wrong++; el.classList.add('wrong'); beep(false); setTimeout(()=>el.classList.remove('wrong'), 500); }
        }); };
      draw(); play(q.audio); return;
    }
    if (q.order){
      // Tàu chữ: nghe câu, chạm các toa theo đúng thứ tự
      const o = q.order, tiles = shuffle(o.tokens.map((t,j)=>({t,j}))); let pos = 0, wrong = 0;
      $('#q').innerHTML = `<div class="card prompt"><div class="ask">Listen and build the train! 🚂</div>
        <div class="builder" id="train" style="flex-wrap:wrap"><span style="font-size:50px">🚂</span>${o.tokens.map((_,j)=>`<span class="slot han" data-slot="${j}">?</span>`).join('')}</div>
        <div class="muted" style="font-size:20px">${esc(o.en)}</div><button class="big-btn" id="rep">🔊 Listen again</button></div>
        <div class="choices">${tiles.map((x,j)=>`<button class="choice" data-t="${j}"><span class="han">${esc(x.t)}</span></button>`).join('')}</div>`;
      $('#rep').onclick = () => play(q.audio); play(q.audio);
      $('#q').querySelectorAll('[data-t]').forEach(el => el.onclick = () => {
        const x = tiles[+el.dataset.t];
        if (x.t === o.tokens[pos]){ const s = $(`[data-slot="${pos}"]`); s.textContent = x.t; s.classList.add('filled'); el.disabled = true; el.style.visibility = 'hidden'; beep(true); pos++;
          if (pos === o.tokens.length){ $('#train').insertAdjacentHTML('afterend', `<div class="py" style="font-size:30px">${colorPy(o.py)}</div>`); play(q.audio);
            if (wrong===0){ right++; addStars(1); } logItem(q.item, wrong===0); setTimeout(()=>{ i++; next(); }, 2200); } }
        else { wrong++; el.classList.add('wrong'); beep(false); setTimeout(()=>el.classList.remove('wrong'), 500); }
      });
      return;
    }
    $('#q').innerHTML = `<div class="card prompt"><div class="ask">${q.ask}</div>${q.show}${q.audio?'<button class="big-btn" id="rep">🔊 Listen again</button>':''}</div>
      <div class="choices ${q.four?'four':''}">${q.choices.map((c,j)=>`<button class="choice" data-j="${j}">${c.html}</button>`).join('')}</div>`;
    if (q.audio){ $('#rep').onclick = () => play(q.audio); play(q.audio); }
    $('#q').querySelectorAll('[data-j]').forEach(el => el.onclick = () => { const c = q.choices[+el.dataset.j]; if (c.sound) play(c.sound); answer(c.ok, el); });
  };
  next();
}

/* ---------- Online sync (bật khi có syncUrl) ---------- */
let syncT;
function scheduleSync(){ if (!CFG.syncUrl || !P) return; clearTimeout(syncT); syncT = setTimeout(pushProgress, 4000); }
function pushProgress(){
  const body = JSON.stringify({action:'save', player:P.id, week:weekKey(), weekStars:P.week[weekKey()]||0, total:P.total, streak:streakNow(), level:stormyLevel(P.stormy.xp), stations:P.st, items:P.items});
  fetch(CFG.syncUrl, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body}).catch(()=>{});
}
if (CFG.syncUrl){ Azure.enabled = true; fetch(CFG.syncUrl+'?action=token').then(r=>r.json()).then(j=>{ if (!j.token) Azure.enabled=false; }).catch(()=>{ Azure.enabled=false; }); }

if (playerId && CFG.players.some(p=>p.id===playerId)) { loadPlayer(playerId); }
go('who');
</script>
